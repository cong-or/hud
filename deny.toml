[advisories]
ignore = [
    # paste is unmaintained but ratatui hasn't migrated yet
    # https://github.com/ratatui/ratatui/issues/1679
    "RUSTSEC-2024-0436",
    # ruzstd decompression-bomb DoS, pulled only transitively via `object`
    # (addr2line/aya) to read zstd debug sections of the *target* binary — never
    # untrusted input, so unreachable here. Can't bump: object 0.36 pins ruzstd
    # ^0.7 and its users haven't moved to object 0.37 / ruzstd 0.9.
    "RUSTSEC-2026-0344",
    # pin-utils is unmaintained (repo archived 2026-10-01); a deep transitive
    # dependency of futures/tokio, not independently removable.
    "RUSTSEC-2026-0441",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",  # Boost Software License (clipboard-win)
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
